<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MK Chess: the map in five years</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
<style>
:root{--bg:#efe9dc;--board:#e3dccb;--land:#cfc7b0;--edge:#17201c;--ink:#17201c;--mute:#5c6660;--amber:#b35c00;--glow:rgba(179,92,0,.35);--card:#f7f3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1512;--board:#131d18;--land:#1f3128;--edge:#3b5a4a;--ink:#efe9dc;--mute:#94a39a;--amber:#ffb84d;--glow:rgba(255,184,77,.45);--card:#15211b}}
:root[data-theme="dark"]{--bg:#0e1512;--board:#131d18;--land:#1f3128;--edge:#3b5a4a;--ink:#efe9dc;--mute:#94a39a;--amber:#ffb84d;--glow:rgba(255,184,77,.45);--card:#15211b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:clamp(34px,10vw,52px);line-height:1;margin:6px 0 4px;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--amber)}
.sub{color:var(--mute);margin:0 0 12px;font-size:15px}
.stage{background:var(--board);border:1px solid var(--edge);border-radius:6px;position:relative;overflow:hidden}
svg{display:block;width:100%;height:auto}
.land{fill:var(--land);stroke:var(--edge);stroke-width:1.2;stroke-linejoin:round}
.sq{fill:var(--ink);opacity:.035}
.arc{fill:none;stroke:var(--amber);stroke-width:.9;opacity:0;transition:opacity .9s}
.arc.lit{opacity:.45}
.dot{opacity:.28;filter:grayscale(1);transition:opacity .5s,filter .5s}
.dot.lit{opacity:1;filter:none}
.halo{fill:var(--glow);opacity:0;transition:opacity .6s}
.halo.lit{opacity:1}
.ring{fill:none;stroke:var(--amber);stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center}
.ring.lit{animation:ping 1.4s ease-out}
@keyframes ping{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(5)}}
.tag{font-size:11px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--board);stroke-width:3px}
.scene{background:var(--card);border:1px solid var(--edge);border-radius:6px;padding:14px 16px;margin:12px 0;min-height:112px}
.scene b{display:block;font-size:13px;color:var(--amber);margin-bottom:4px}
.scene p{margin:0;font-size:17px;line-height:1.4}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{border-left:3px solid var(--amber);padding-left:10px}
.stats strong{display:block;font-size:22px;font-weight:800;line-height:1.1}
.stats small{color:var(--mute);font-size:12px}
.ctl{display:flex;gap:10px;align-items:center;margin-bottom:10px}
button{font:inherit;font-weight:700;background:var(--amber);color:var(--bg);border:0;border-radius:6px;padding:11px 18px;cursor:pointer;min-width:92px}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input[type=range]{flex:1;accent-color:var(--amber);height:32px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mute);margin:6px 0}
.row input[type=number]{width:96px;font:inherit;padding:6px 8px;border:1px solid var(--edge);border-radius:6px;background:var(--card);color:var(--ink)}
.row input[type=range]{max-width:55%}
.note{font-size:12.5px;color:var(--mute);margin-top:14px}
@media (prefers-reduced-motion:reduce){.ring.lit{animation:none}.arc,.dot,.halo{transition:none}}
</style>
</head>
<body>
<main>
<h1><span id="n">1</span> city.<br>Then the whole map.</h1>
<p class="sub" id="when">Today: Milton Keynes</p>

<div class="stage">
<svg id="map" viewBox="0 0 400 650" role="img" aria-label="Map of Great Britain filling with MK Chess cities as the network grows"></svg>
</div>

<div class="scene" aria-live="polite"><b id="sh"></b><p id="st"></p></div>

<div class="stats">
<div><strong id="s1">0</strong><small>people in the room each year</small></div>
<div><strong id="s2">£0</strong><small>yearly revenue run-rate</small></div>
<div><strong id="s3">0</strong><small>Session Leaders employed</small></div>
</div>

<div class="ctl">
<button id="play">Play</button>
<input type="range" id="m" min="0" max="60" value="0" aria-label="Months from now">
</div>
<div class="row"><label for="rate">New cities per month</label><input type="range" id="rate" min="0.2" max="1" step="0.05" value="0.4"></div>
<div class="row"><label for="rev">Revenue per mature city a year (£)</label><input type="number" id="rev" value="15000" min="0" step="1000"></div>
<div class="row"><label for="att">Attendances per mature city a year</label><input type="number" id="att" value="1500" min="0" step="100"></div>
<p class="note">The numbers are placeholders to play with, not forecasts. Each new city takes 12 months to reach full strength. Swap in your real figures and watch the map change.</p>
</main>
